<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Log in | Transert</title>
    <meta name="description" content="Log in to the Transert freight load board prototype." />
    <meta name="theme-color" content="#edf1ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101a15" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-container">
      <a href="index.html" class="auth-back">← Back to Transert</a>
      
      <div class="auth-card">
        <div class="auth-header">
          <div class="brand">Transert<span>.</span></div>
          <h1>Welcome back</h1>
          <p>Log in to manage your loads and routes.</p>
        </div>

        <!-- Note: Prototype only. No data is sent to a server. -->
        <form id="login-form" class="auth-form">
          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" />
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="password">Password</label>
              <a href="#" class="forgot-link">Forgot?</a>
            </div>
            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" />
          </div>

          <button type="submit" class="btn btn-primary auth-submit" id="submit-btn">
            Log in
          </button>
        </form>

        <div class="auth-footer">
          <p>Don't have an account? <a href="#">Apply for early access</a></p>
          <p class="prototype-notice">Prototype only — no real accounts exist.</p>
        </div>
      </div>
    </main>

    <script>
      // Simulates a login for the prototype
      document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        
        btn.textContent = 'Logging in...';
        btn.style.opacity = '0.7';
        btn.disabled = true;

        // Wait 1 second, then redirect back to the home page
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      });
    </script>
  </body>
</html>
